default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

fail_fast: false

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash
        args:
          - "-c"
          - "export PATH=\"$PATH:$(go env GOPATH)/bin\" && cd backend && git diff --staged --name-only --diff-filter=ACM | grep '\\.go$' | xargs -I{} dirname | sort -u | sed 's|^|./|;s|/$||' | xargs -I{} gofmt -l -w {}"
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: bash
        args:
          - "-c"
          - "export PATH=\"$PATH:$(go env GOPATH)/bin\" && cd backend && PKGS=$(git diff --staged --name-only --diff-filter=ACM | grep '\\.go$' | xargs -I{} dirname | sort -u | sed 's|^|./|;s|/$||') && [ -n \"$PKGS\" ] && go vet $PKGS || true"
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash
        args:
          - "-c"
          - "export PATH=\"$PATH:$(go env GOPATH)/bin\" && cd backend && FILES=$(git diff --staged --name-only --diff-filter=ACM | grep '\\.go$') && [ -n \"$FILES\" ] && golangci-lint run $FILES --timeout=5m || true"
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        entry: bash
        args:
          - "-c"
          - "export PATH=\"$PATH:$(go env GOPATH)/bin\" && cd backend && PKGS=$(git diff --staged --name-only --diff-filter=ACM | grep '\\.go$' | xargs -I{} dirname | sort -u | sed 's|^|./|;s|/$||') && [ -n \"$PKGS\" ] && go test $PKGS || true"
        language: system
        types: [go]
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: bash
        args:
          - "-c"
          - "cd frontend && FILES=$(git diff --staged --name-only --diff-filter=ACM | grep -E '\\.(js|jsx|ts|tsx)$') && [ -n \"$FILES\" ] && npx eslint $FILES --max-warnings=0 || true"
        language: node
        types: [javascript, jsx]
        pass_filenames: false
        require_serial: true

      - id: prettier-check
        name: prettier
        entry: bash
        args:
          - "-c"
          - "cd frontend && FILES=$(git diff --staged --name-only --diff-filter=ACM | grep -E '\\.(js|jsx|ts|tsx|css|json)$') && [ -n \"$FILES\" ] && npx prettier --check $FILES || true"
        language: node
        types: [javascript, css, json]
        pass_filenames: false
        require_serial: true

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      IS_DEVELOPMENT: ${IS_DEVELOPMENT:-false}
      DEBUG: ${DEBUG:-false}
      APP_ENV: ${APP_ENV}
      APP_PORT: ${APP_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      BLUEPRINT_DB_HOST: ${BLUEPRINT_DB_HOST}
      BLUEPRINT_DB_PORT: ${BLUEPRINT_DB_PORT:-5432}
      BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE}
      BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME}
      BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
      BLUEPRINT_DB_SCHEMA: ${BLUEPRINT_DB_SCHEMA:-public}
      BLUEPRINT_DB_DIALECT: ${BLUEPRINT_DB_DIALECT:-pgx}
    networks:
      - blueprint
    volumes:
      - ./backend/datasets:/app/datasets
    # depends_on is commented out since DB service is not managed by compose
    # depends_on:

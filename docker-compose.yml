version: "3.9"

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8080:8080"

    environment:
      BLUEPRINT_ENV: ${BLUEPRINT_ENV}
      BLUEPRINT_PORT: ${BLUEPRINT_PORT}
      BLUEPRINT_DB_HOST: psql_bp
      BLUEPRINT_DB_PORT: 5432
      BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE}
      BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME}
      BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
      BLUEPRINT_DB_SCHEMA: ${BLUEPRINT_DB_SCHEMA}
      BLUEPRINT_DB_DIALECT: pgx
      BLUEPRINT_JWT_SECRET: ${BLUEPRINT_JWT_SECRET}
      BLUEPRINT_JWT_EXPIRY: ${BLUEPRINT_JWT_EXPIRY}
      BLUEPRINT_JWT_ISSUER: ${BLUEPRINT_JWT_ISSUER}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}

    networks:
      - blueprint

    depends_on:
      psql_bp:
        condition: service_healthy

  psql_bp:
    image: docker.io/library/postgres:16-alpine
    container_name: blueprint_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${BLUEPRINT_DB_DATABASE}
      POSTGRES_USER: ${BLUEPRINT_DB_USERNAME}
      POSTGRES_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust

    ports:
      - "${BLUEPRINT_DB_PORT:-5432}:5432"

    volumes:
      - psql_volume_bp:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BLUEPRINT_DB_USERNAME} -d ${BLUEPRINT_DB_DATABASE}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - blueprint

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    networks:
      - blueprint

volumes:
  psql_volume_bp:

networks:
  blueprint:
    driver: bridge

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: ${PORT}
      APP_DB_HOST: ${DB_HOST}
      APP_DB_PORT: ${DB_PORT}
      APP_DB_NAME: ${DB_DATABASE}
      APP_DB_USER: ${DB_USERNAME}
      APP_DB_PASS: ${DB_PASSWORD}
      APP_DB_SCHEMA: ${DB_SCHEMA}
    networks:
      - blueprint
    volumes:
      - ./backend/internal/datasets:/app/internal/datasets

networks:
  blueprint:
services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    container_name: blueprint_migrate
    env_file:
      - .env
    environment:
      BLUEPRINT_DB_HOST: psql_bp
      BLUEPRINT_DB_PORT: "5432"
      BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE}
      BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME}
      BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
    volumes:
      - ./backend/datasets:/datasets
    networks:
      - blueprint
    depends_on:
      psql_bp:
        condition: service_healthy
    working_dir: /app
    command: ./migrate up

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: backend
    restart: unless-stopped
    
    env_file:
      - .env

    ports:
      - "8080:8080"

    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}

      BLUEPRINT_DB_HOST: psql_bp
      BLUEPRINT_DB_PORT: ${BLUEPRINT_DB_PORT:-5433}
      BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE}
      BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME}
      BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
      BLUEPRINT_DB_SCHEMA: ${BLUEPRINT_DB_SCHEMA}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}

    volumes:
      - ./backend/datasets:/app/datasets

    networks:
      - blueprint

    depends_on:
      migrate:
        condition: service_completed_successfully
      psql_bp:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: blueprint_redis
    restart: unless-stopped
  
    ports:
      - "6379:6379"
  
    volumes:
      - redis_data:/data
  
    command: redis-server --appendonly yes
  
    networks:
      - blueprint

  psql_bp:
    image: docker.io/library/postgres:16-alpine
    container_name: blueprint_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${BLUEPRINT_DB_DATABASE}
      POSTGRES_USER: ${BLUEPRINT_DB_USERNAME}
      POSTGRES_PASSWORD: ${BLUEPRINT_DB_PASSWORD}

    ports:
      - "${BLUEPRINT_DB_PORT:-5434}:5432"

    volumes:
      - psql_volume_bp:/var/lib/postgresql/data
      - ./backend/datasets:/datasets

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BLUEPRINT_DB_USERNAME} -d ${BLUEPRINT_DB_DATABASE}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - blueprint

volumes:
  psql_volume_bp:
  redis_data:

networks:
  blueprint:
    driver: bridge

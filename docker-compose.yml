version: "3.9"

services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    container_name: blueprint_migrate
    env_file:
      - .env
    environment:
      BLUEPRINT_DB_HOST: psql_bp
      BLUEPRINT_DB_PORT: "5432"
      BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE}
      BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME}
      BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
    networks:
      - blueprint
    depends_on:
      psql_bp:
        condition: service_healthy

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8080:8080"

    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      BLUEPRINT_DB_HOST: psql_bp
      BLUEPRINT_DB_PORT: 5432
      BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE}
      BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME}
      BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD}
      BLUEPRINT_DB_SCHEMA: ${BLUEPRINT_DB_SCHEMA}

    volumes:
      - ./backend/datasets:/app/datasets

    networks:
      - blueprint

    depends_on:
      migrate:
        condition: service_completed_successfully
      psql_bp:
        condition: service_healthy

  psql_bp:
    image: postgres:16-alpine
    container_name: blueprint_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${BLUEPRINT_DB_DATABASE}
      POSTGRES_USER: ${BLUEPRINT_DB_USERNAME}
      POSTGRES_PASSWORD: ${BLUEPRINT_DB_PASSWORD}

    ports:
      - "${BLUEPRINT_DB_PORT:-5432}:5432"

    volumes:
      - psql_volume_bp:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BLUEPRINT_DB_USERNAME} -d ${BLUEPRINT_DB_DATABASE}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - blueprint

volumes:
  psql_volume_bp:

networks:
  blueprint:
    driver: bridge
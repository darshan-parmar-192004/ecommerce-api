name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests"
        required: false
        default: "false"

jobs:
  lint:
    name: Lint GO code
    runs-on: vm-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.x"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run lint
        run: |
          cd backend
          golangci-lint run ./... --timeout 5m

  test:
    name: Run Go Tests
    runs-on: vm-hosted
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.x"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: |
          cd backend
          CI=true go test ./... -v

  container-test:
    name: Container Integration Test
    runs-on: vm-hosted
    needs: test
    env:
      BLUEPRINT_DB_PORT: 5433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up previous volumes
        run: docker compose down -v

      - name: Run Application Stack
        run: |
          docker compose up -d --build app

      - name: Wait for services
        run: |
          for i in {1..45}; do
            # We check the 'backend' container health status
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' backend 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Application is healthy!"
              exit 0
            fi

            # Check if migration failed early
            MIGRATE_EXIT=$(docker inspect --format='{{.State.ExitCode}}' blueprint_migrate 2>/dev/null || echo "0")
            if [ "$MIGRATE_EXIT" != "0" ]; then
              echo "Migration failed with exit code $MIGRATE_EXIT"
              docker logs blueprint_migrate
              exit 1
            fi

            echo "Waiting for service... status is $STATUS ($i/45)"
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker compose logs
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- Postgres Logs ---"
          docker logs blueprint_postgres
          echo "--- Migration Logs ---"
          docker logs blueprint_migrate
          echo "--- App Logs ---"
          docker logs backend

      - name: Stop containers
        if: always()
        run: docker compose down -v

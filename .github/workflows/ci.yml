name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint GO code
    runs-on: vm-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.x"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run lint
        run: |
          cd backend
          golangci-lint run ./...

  test:
    name: Run Go Tests
    runs-on: vm-hosted
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.x"

      - name: Download dependencies
        run: |
          cd backend
          go mod download

      - name: Run tests
        run: |
          cd backend
          go test ./... -v

  container-test:
    name: Container Integration Test
    runs-on: vm-hosted
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start containers
        run: |
          podman-compose up -d --build

      - name: Wait for services
        run: |
          sleep 15

      - name: Check health endpoint
        run: |
          curl -f http://localhost:8080/health

      - name: Show logs if failure
        if: failure()
        run: |
          podman-compose logs

      - name: Stop containers
        if: always()
        run: |
          podman-compose down
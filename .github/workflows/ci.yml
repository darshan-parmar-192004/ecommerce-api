name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests"
        required: false
        default: "false"

jobs:
  lint:
    name: Lint GO code
    runs-on: vm-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.8"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run lint
        run: |
          cd backend
          golangci-lint run ./... --timeout 5m

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend
          govulncheck ./...

  test:
    name: Run Unit Tests
    runs-on: vm-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.8"

      - name: Run Unit Tests
        run: |
          cd backend
          # Set the skip flag for the entire test run
          # APP_ENV=unit_test_no_redis go test ./...

  container-test:
    name: Container Integration Test
    runs-on: vm-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up environment
        run: |
          docker compose down -v --remove-orphans || true
          # Kill local processes that might block ports on the VM
          sudo fuser -k 8080/tcp 6379/tcp 5432/tcp 2>/dev/null || true

      - name: Run Integration Tests in Docker
        run: |
          # Use docker compose run and pass explicit vars
          docker compose run --rm \
          -e REDIS_HOST=redis \
          -e REDIS_PORT=6379 \
          -e BLUEPRINT_DB_HOST=psql_bp \
          -e BLUEPRINT_DB_PORT=5432 \
          -e APP_ENV=ci \
          test-runner

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

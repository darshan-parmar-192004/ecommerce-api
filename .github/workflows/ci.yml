name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        default: 'false'

jobs:
  lint:
    name: Lint GO code
    runs-on: vm-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.8"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run lint
        run: |
          cd backend
          golangci-lint run ./... --timeout 5m

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend
          govulncheck ./...

  test:
    name: Run Go Tests
    runs-on: vm-hosted
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.8"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests
        run: |
          cd backend
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Combine coverage reports
        if: always()
        run: |
          cd backend
          COVERAGE=$(go tool cover -func=coverage.out 2>/dev/null | grep total | awk '{print $3}' | sed 's/%//' || echo "0")
          echo "Total coverage: $COVERAGE%"
          
          COVERAGE_INT=$(echo "$COVERAGE" | awk '{print int($1)}')
          if [ "$COVERAGE_INT" -lt 75 ]; then
            echo "ERROR: Coverage ($COVERAGE%) is below minimum threshold (75%)"
            exit 1
          fi
          echo "Coverage check passed: $COVERAGE%"

  container-test:
    name: Container Integration Test
    runs-on: vm-hosted
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop local PostgreSQL services
        run: |
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo service postgresql stop 2>/dev/null || true
          sudo pkill -f postgres 2>/dev/null || true
          sleep 2

      - name: Clean up previous volumes
        run: docker compose down -v --remove-orphans || true

      - name: Create .env file for CI
        run: |
          cat <<EOF > .env
          APP_ENV=ci
          PORT=8080
          BLUEPRINT_DB_DATABASE=ecommerce
          BLUEPRINT_DB_USERNAME=darshan.parmar
          BLUEPRINT_DB_PASSWORD=blueprint
          BLUEPRINT_DB_SCHEMA=public
          BLUEPRINT_DB_PORT=5432
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF

      - name: Build and start database services
        run: |
          docker compose up -d psql_bp redis
          
      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            if docker compose exec -T psql_bp pg_isready -U darshan.parmar -d ecommerce 2>/dev/null; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for postgres... ($i/30)"
            sleep 2
          done
          docker compose logs psql_bp
          exit 1

      - name: Build app image
        run: |
          docker build -t ecommerce-api:latest ./backend

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            ecommerce-api:latest

      - name: Build and start app
        run: |
          docker compose up -d --build app
          docker compose logs --tail=20

      - name: Wait for services
        run: |
          for i in {1..45}; do
            # Using service name filter to find the correct container
            STATUS=$(docker ps --filter "label=com.docker.compose.service=app" --format "{{.Status}}" | grep -o "healthy" || echo "unhealthy")
            if [ "$STATUS" == "healthy" ]; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service... ($i/45) Status: $STATUS"
            sleep 2
          done
          echo "Service did not start in time"
          docker compose logs app
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v
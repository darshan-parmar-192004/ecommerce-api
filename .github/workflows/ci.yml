name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        default: 'false'

jobs:
  lint:
    name: Lint GO code
    runs-on: vm-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.8"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run lint
        run: |
          cd backend
          golangci-lint run ./... --timeout 5m

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend
          govulncheck ./...

  test:
    name: Run Go Tests
    runs-on: vm-hosted
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.8"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: |
          cd backend
          CI=true go test ./... -v

  container-test:
    name: Container Integration Test
    runs-on: vm-hosted
    needs: test
    env:
      BLUEPRINT_DB_PORT: 5433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up previous volumes
        run: docker compose down -v

      - name: Build and start containers
        run: |
          docker compose up -d psql_bp redis
          docker compose logs --tail=20
          
      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            if docker compose exec -T psql_bp pg_isready -U darshan.parmar -d ecommerce 2>/dev/null; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not start"
          docker compose logs
          exit 1

      - name: Build app image
        run: |
          docker build -t ecommerce-api:latest ./backend

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.0 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            ecommerce-api:latest

      - name: Build and start app
        run: |
          docker compose up -d --build app
          docker compose logs --tail=20

      - name: Wait for services
        run: |
          for i in {1..45}; do
            if docker inspect --format='{{.State.Health.Status}}' backend 2>/dev/null | grep -q "healthy"; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service... ($i/45)"
            sleep 2
          done
          echo "Service did not start in time"
          docker compose logs
          exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        run: |
          docker compose down
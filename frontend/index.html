<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
  <link rel="stylesheet" href="/src/index.css">
</head>
<body class="bg-white min-h-screen flex flex-col dark:bg-gray-900">
  <div id="header-root"></div>
  
  <main id="app" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" role="main"></main>
  
  <div id="footer-root"></div>
  
  <div id="loading-overlay" class="fixed inset-0 bg-white/90 z-50 flex items-center justify-center hidden transition-opacity duration-300">
    <div class="text-center">
      <div class="relative w-16 h-16 mx-auto mb-4">
        <div class="absolute inset-0 border-4 border-indigo-200 rounded-full"></div>
        <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
      </div>
      <p class="text-gray-600 font-medium">Loading...</p>
    </div>
  </div>
  
  <div id="toast-container" class="fixed bottom-4 right-4 z-50" role="alert" aria-live="polite"></div>
  
  <script type="module" src="/src/app.js"></script>
</body>
</html>
